name: Destroy Infrastructure

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to destroy (staging/production)'
        required: true
        type: choice
        options:
          - staging
          - production
      confirm:
        description: 'Type DESTROY to confirm'
        required: true

env:
  AWS_REGION: ap-south-1
  TERRAFORM_VERSION: '1.5.0'
  APP_NAME: bankapp

permissions:
  contents: read
  id-token: write

jobs:
  validate-input:
    runs-on: ubuntu-latest
    steps:
      - name: Check confirmation
        if: inputs.confirm != 'DESTROY'
        run: |
          echo "Error: You must type DESTROY to confirm infrastructure destruction"
          exit 1

  destroy-environment:
    needs: validate-input
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Delete ECR Images
        run: |
          # Delete all images in the repository
          IMAGES=$(aws ecr list-images --repository-name ${{ env.APP_NAME }} --query 'imageIds[*]' --output json)
          if [ "$IMAGES" != "[]" ] && [ "$IMAGES" != "" ]; then
            aws ecr batch-delete-image \
              --repository-name ${{ env.APP_NAME }} \
              --image-ids "$IMAGES"
          fi

      - name: Delete ECR Repository
        run: |
          aws ecr delete-repository \
            --repository-name ${{ env.APP_NAME }} \
            --force || true

      - name: Terraform Init
        run: terraform init
        working-directory: infra

      - name: Terraform Workspace
        run: |
          terraform workspace select ${{ inputs.environment }} || \
          terraform workspace new ${{ inputs.environment }}
        working-directory: infra

      - name: Terraform Destroy Plan
        id: plan
        run: |
          terraform plan -destroy \
            -var="environment=${{ inputs.environment }}" \
            -var="app_name=${{ env.APP_NAME }}" \
            -var="region=${{ env.AWS_REGION }}" \
            -out=tfdestroyplan
        working-directory: infra

      - name: Terraform Destroy
        run: terraform apply -auto-approve tfdestroyplan
        working-directory: infra

  cleanup-helm:
    needs: [validate-input, destroy-environment]
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: v3.12.0

      - name: Uninstall Helm Releases
        continue-on-error: true
        run: |
          # Try to get cluster name (might fail if cluster is already destroyed)
          CLUSTER_NAME=$(aws eks list-clusters --query 'clusters[0]' --output text) || true
          if [ "$CLUSTER_NAME" != "" ] && [ "$CLUSTER_NAME" != "None" ]; then
            aws eks update-kubeconfig --name $CLUSTER_NAME --region ${{ env.AWS_REGION }}
            helm list -n ${{ inputs.environment }} --short | xargs -r helm uninstall -n ${{ inputs.environment }}
          fi
