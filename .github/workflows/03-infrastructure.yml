name: Infrastructure Deployment

on:
  push:
    branches: [ develop, main ]
    paths:
      - 'infra/**'
      - '.github/workflows/03-infrastructure.yml'
      - 'helm/**'
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  TERRAFORM_VERSION: '1.5.0'
  APP_NAME: bankapp
  TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
  
permissions:
  contents: read
  id-token: write


jobs:
  deploy-infrastructure:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    outputs:
      ecr_repository_url: ${{ steps.terraform_output.outputs.ecr_repository_url }}
      eks_cluster_name: ${{ steps.terraform_output.outputs.eks_cluster_name }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Install eksctl
        run: |
          curl --silent --location "https://github.com/weaveworks/eksctl/releases/latest/download/eksctl_$(uname -s)_amd64.tar.gz" | tar xz -C /tmp
          sudo mv /tmp/eksctl /usr/local/bin
          eksctl version

      - name: Terraform Init with State Backend
        run: |
          terraform init \
            -backend-config="bucket=${{ env.TF_STATE_BUCKET }}" \
            -backend-config="key=bankapp/${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}"
          terraform fmt -check -recursive
        working-directory: infra

      - name: Terraform Validate
        run: terraform validate -no-color
        working-directory: infra

      - name: Create ECR Repository
        run: |
          aws ecr describe-repositories --repository-names ${{ env.APP_NAME }} 2>/dev/null || \
          aws ecr create-repository \
            --repository-name ${{ env.APP_NAME }} \
            --image-scanning-configuration scanOnPush=true \
            --tags Key=Environment,Value=${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan \
            -var="environment=${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}" \
            -var="app_name=${{ env.APP_NAME }}" \
            -var="region=${{ env.AWS_REGION }}" \
            -out=tfplan
        working-directory: infra

      - name: Terraform Apply
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: terraform apply -auto-approve tfplan
        working-directory: infra

      - name: Output Infrastructure Values
        id: terraform_output
        run: |
          echo "ecr_repository_url=$(terraform output -raw ecr_repository_url)" >> $GITHUB_OUTPUT
          echo "eks_cluster_name=$(terraform output -raw eks_cluster_name)" >> $GITHUB_OUTPUT
        working-directory: infra

  setup-kubernetes:
    name: Setup Kubernetes Components
    needs: deploy-infrastructure
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name ${{ needs.deploy-infrastructure.outputs.eks_cluster_name }} --region ${{ env.AWS_REGION }}

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: v3.12.0

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3

      - name: Create IAM Role for ALB Controller
        run: |
          # Check if role exists, create if not
          aws iam get-role --role-name AmazonEKSLoadBalancerControllerRole 2>/dev/null || \
          eksctl create iamserviceaccount \
            --cluster=${{ needs.deploy-infrastructure.outputs.eks_cluster_name }} \
            --namespace=kube-system \
            --name=aws-load-balancer-controller \
            --role-name AmazonEKSLoadBalancerControllerRole \
            --attach-policy-arn=arn:aws:iam::aws:policy/ElasticLoadBalancingFullAccess \
            --override-existing-serviceaccounts \
            --approve

      - name: Check and Deploy ALB Ingress Controller
        run: |
          if ! helm list -n kube-system | grep -q aws-load-balancer-controller; then
            echo "Deploying AWS Load Balancer Controller..."
            helm repo add eks https://aws.github.io/eks-charts
            helm repo update
            helm upgrade --install aws-load-balancer-controller eks/aws-load-balancer-controller \
              -n kube-system \
              --set clusterName=${{ needs.deploy-infrastructure.outputs.eks_cluster_name }} \
              --set serviceAccount.create=false \
              --set serviceAccount.name=aws-load-balancer-controller \
              --set region=${{ env.AWS_REGION }} \
              --wait
          else
            echo "AWS Load Balancer Controller already installed"
          fi

      - name: Deploy Metrics Server
        run: |
          kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml

      - name: Wait for Infrastructure Components to be Ready
        run: |
          echo "Waiting for EKS cluster to be active..."
          aws eks wait cluster-active --name ${{ needs.deploy-infrastructure.outputs.eks_cluster_name }} --region ${{ env.AWS_REGION }}
          
          echo "Waiting for nodes to be ready..."
          kubectl get nodes
          kubectl wait --for=condition=Ready nodes --all --timeout=300s
          
          echo "Waiting for metrics-server deployment..."
          kubectl -n kube-system wait deployment metrics-server --for condition=available --timeout=300s
          
          echo "Waiting for ALB controller deployment..."
          kubectl -n kube-system wait deployment aws-load-balancer-controller --for condition=available --timeout=300s
          
          echo "All infrastructure components are ready!"
